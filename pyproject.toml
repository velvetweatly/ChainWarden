[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chainwarden"
version = "0.6.0"
description = "Offline X.509 and TLS certificate fleet lifecycle auditor."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "the ChainWarden authors" }]
keywords = ["x509", "tls", "certificate", "pki", "audit"]

[project.scripts]
