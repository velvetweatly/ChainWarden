<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 96" role="img"
     aria-labelledby="logoTitle logoDesc" width="240" height="96">
  <!--
    Palette reason: the subject is certificate trust chains. Slate #1f2933 is
    the structural ink for the blocks and wordmark. Green #157347 marks a link
    that verifies (subject to issuer match), the healthy state this tool looks
    for. Amber #b45309 is the single accent on the last block, the leaf, which
    is the certificate an operator inspects first. Two cores plus one accent.
    Contrast on the painted #ffffff background: slate 13.6:1, green 5.3:1,
    amber 5.9:1, all at or above WCAG AA for normal text.
    The mark is a literal diagram of the core data structure: three linked
    certificate blocks, root then intermediate then leaf. Geometry is exact,
    every block 44 wide and 28 tall on whole pixel coordinates, one link width.
  -->
  <title id="logoTitle">ChainWarden</title>
  <desc id="logoDesc">Wordmark with a three block certificate chain: root,
    intermediate, and leaf, linked left to right.</desc>

  <rect x="0" y="0" width="240" height="96" fill="#ffffff"/>

  <!-- three certificate blocks, corner radius 3 reused throughout -->
  <!-- root block -->
  <rect x="16" y="18" width="44" height="28" rx="3" fill="none"
        stroke="#1f2933" stroke-width="1.5"/>
  <line x1="24" y1="27" x2="52" y2="27" stroke="#1f2933" stroke-width="1"/>
  <line x1="24" y1="33" x2="52" y2="33" stroke="#1f2933" stroke-width="1"/>
  <line x1="24" y1="39" x2="44" y2="39" stroke="#1f2933" stroke-width="1"/>

  <!-- intermediate block -->
  <rect x="98" y="18" width="44" height="28" rx="3" fill="none"
        stroke="#1f2933" stroke-width="1.5"/>
  <line x1="106" y1="27" x2="134" y2="27" stroke="#1f2933" stroke-width="1"/>
  <line x1="106" y1="33" x2="134" y2="33" stroke="#1f2933" stroke-width="1"/>
  <line x1="106" y1="39" x2="126" y2="39" stroke="#1f2933" stroke-width="1"/>

  <!-- leaf block, accent stroke because it is inspected first -->
  <rect x="180" y="18" width="44" height="28" rx="3" fill="none"
        stroke="#b45309" stroke-width="1.5"/>
  <line x1="188" y1="27" x2="216" y2="27" stroke="#b45309" stroke-width="1"/>
  <line x1="188" y1="33" x2="216" y2="33" stroke="#b45309" stroke-width="1"/>
  <line x1="188" y1="39" x2="208" y2="39" stroke="#b45309" stroke-width="1"/>

  <!-- links: an open ring joining adjacent blocks, in the verify green -->
  <circle cx="79" cy="32" r="7" fill="none" stroke="#157347" stroke-width="1.5"/>
  <line x1="60" y1="32" x2="72" y2="32" stroke="#157347" stroke-width="1.5"/>
